services:
  - type: web
    name: studymate-api
    runtime: docker
    repo: https://github.com/anomalyco/StudyMate-AI
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: studymate-uploads
      - key: DB_SSL
        value: "require"
      - key: FRONTEND_URL
        sync: false
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /api/health
    autoDeploy: true
